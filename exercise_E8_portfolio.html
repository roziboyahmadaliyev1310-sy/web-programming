<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Portfolio - Your Name
  </title>
  <style>:root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --card-bg: #ffffff;
    --text: #1e293b;
}
body {
    margin: 0;
    font-family: sans-serif;
    background-color: var(--bg);
    color: var(--text);
}
nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: var(--primary);
    color: white;
    padding: 1rem 2rem;
    z-index: 100;
}
.container {
    max-width: 900px;
    margin: 80px auto 40px;
    padding: 0 20px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}
.card {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ccfbf1;
}</style>
 </head>
 <body>
  <nav>
   <strong>
    Your Name
   </strong>
   | Portfolio
  </nav>
  <div class="container">
   <div class="grid">
    <div class="card">
     <h3>
      Project 1
     </h3>
     <p>
      A web development project demonstrating CSS layout capabilities.
     </p>
    </div>
   </div>
  </div>
 </body>
</html>
