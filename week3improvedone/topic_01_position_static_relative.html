<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 01 - position: static & relative</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        background: #f3f4f6;
      }
      .box {
        width: 160px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 12px;
        color: white;
        font-weight: bold;
        background: #0f766e;
      }
      .relative {
        position: relative;
        top: 18px;
        left: 30px;
        background: #14b8a6;
      }
    </style>
  </head>
  <body>
    <div class="box">static</div>
    <div class="box relative">relative</div>
    <div class="box">normal flow</div>
  </body>
</html>
