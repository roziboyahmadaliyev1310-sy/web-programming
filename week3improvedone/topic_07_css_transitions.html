<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 07 - CSS Transitions</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
      }
      .box {
        width: 160px;
        height: 160px;
        background: #0f766e;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        transition: background 0.4s ease, transform 0.4s ease, border-radius 0.4s ease;
      }
      .box:hover {
        background: #14b8a6;
        transform: translateY(-10px) scale(1.05);
        border-radius: 40px;
      }
    </style>
  </head>
  <body>
    <div class="box">Hover me</div>
  </body>
</html>
