<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 02 - position: absolute</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background: #ecfeff;
      }
      .card {
        position: relative;
        width: 300px;
        height: 180px;
        background: #f0fdfa;
        border: 2px solid #14b8a6;
        border-radius: 12px;
        margin: 40px auto;
      }
      .badge {
        position: absolute;
        top: -12px;
        right: -12px;
        background: #0f766e;
        color: white;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
      }
      .title {
        padding: 28px 20px 0;
        font-size: 24px;
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">NEW</span>
      <div class="title">CSS Advanced</div>
    </div>
  </body>
</html>
