<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise E6 - Responsive Grid</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        padding: 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      .item {
        background: #dbeafe;
        border-radius: 10px;
        padding: 24px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="item">Card 1</div>
      <div class="item">Card 2</div>
      <div class="item">Card 3</div>
      <div class="item">Card 4</div>
    </div>
  </body>
</html>
