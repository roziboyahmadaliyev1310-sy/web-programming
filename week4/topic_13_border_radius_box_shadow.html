<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 13 - Border Radius & Box Shadow</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f8fafc;
        font-family: Arial, sans-serif;
      }
      .card {
        width: 240px;
        padding: 24px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 10px 25px rgba(15, 118, 110, 0.2);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Rounded Card</h2>
      <p>Soft shadow and rounded corners</p>
    </div>
  </body>
</html>
