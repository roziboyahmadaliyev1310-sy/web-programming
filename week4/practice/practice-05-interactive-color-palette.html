<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#204b66">
  <title>Palette Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d303a;
      --muted: #66777d;
      --paper: #f1f3ed;
      --surface: #fffefa;
      --line: #d8dfd8;
      --blue: #204b66;
      --cyan: #22b9c2;
      --yellow: #e6dc42;
      --green: #d9e9df;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px 48px;
      background: radial-gradient(ellipse at 50% 0%, #dbe7e5, var(--paper) 68%);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    main { width: min(100%, 940px); margin: 0 auto; }

    .back {
      color: var(--blue);
      font-size: .9rem;
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .masthead {
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      padding: clamp(24px, 5vw, 48px);
      border-radius: 7px;
      background: linear-gradient(115deg, #204b66, #397491);
      color: white;
    }

    .masthead::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 7px;
      background: var(--yellow);
      content: "";
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #e4eeea;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow { margin: 0; }
    h1 { margin: 28px 0 8px; font: 500 clamp(2.2rem, 6vw, 4.1rem)/1 Georgia, "Times New Roman", serif; }
    .intro { max-width: 600px; margin: 0; color: #e3eeeb; line-height: 1.6; }

    .workspace-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .workspace-heading h2 { margin: 0; font-size: 1.35rem; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .add-form { display: flex; flex: 1 1 300px; gap: 8px; min-width: 0; }

    input, button { min-height: 44px; border-radius: 5px; font: inherit; }
    input { width: 100%; min-width: 0; padding: 0 12px; border: 1px solid #bbc8c3; background: white; color: var(--ink); }
    button { padding: 0 15px; border: 0; background: var(--blue); color: white; font-weight: 700; cursor: pointer; transition: background-color 150ms ease, transform 150ms ease; }
    button:hover { transform: translateY(-1px); background: #17394f; }
    .export-button { background: #d9e9df; color: #1d4033; }
    .export-button:hover { background: #c6dfd0; }

    :focus-visible { outline: 3px solid #e1cb32; outline-offset: 3px; }

    .palette {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .swatch {
      position: relative;
      min-width: 0;
      min-height: 150px;
      overflow: hidden;
      border: 1px solid rgb(29 48 58 / 14%);
      border-radius: 5px;
      transition: min-height 220ms ease, transform 220ms ease, box-shadow 220ms ease;
    }

    .swatch:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgb(29 48 58 / 12%); }
    .swatch.expanded { min-height: 190px; }
    .swatch-color {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
    }
    .swatch-color:hover { transform: none; background: transparent; }
    .swatch-code { opacity: 0; font: 700 1.1rem/1 monospace; transform: translateY(6px); transition: opacity 180ms ease, transform 180ms ease; }
    .swatch.expanded .swatch-code { opacity: 1; transform: translateY(0); }
    .swatch-remove {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 1;
      width: 34px;
      min-height: 34px;
      padding: 0;
      border: 1px solid rgb(29 48 58 / 18%);
      border-radius: 50%;
      background: rgb(255 255 255 / 88%);
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1;
    }
    .swatch-remove:hover { transform: none; background: white; }

    .message { min-height: 1.4em; margin: 12px 0 0; color: var(--muted); font-size: .9rem; }
    footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; }

    @media (max-width: 650px) {
      .workspace-heading { align-items: start; flex-direction: column; }
      .palette { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .swatch { min-height: 125px; }
      .swatch.expanded { min-height: 160px; }
    }

    @media (max-width: 390px) {
      body { padding-right: 14px; padding-left: 14px; }
      .topline { align-items: start; flex-direction: column; gap: 5px; }
      .add-form { flex-basis: 100%; }
      .add-form button { padding: 0 11px; }
      .palette { grid-template-columns: 1fr 1fr; }
      footer { flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Web Programming</a>

    <header class="masthead">
      <div class="topline"><p class="eyebrow">Palette Studio</p><span>Local workspace</span></div>
      <h1>Color palette</h1>
      <p class="intro">A focused workspace for collecting, refining, and exporting color sets.</p>
    </header>

    <section aria-labelledby="palette-heading">
      <div class="workspace-heading">
        <h2 id="palette-heading">Current palette</h2>
        <span id="color-count" aria-live="polite">6 colors</span>
      </div>

      <div class="toolbar">
        <form class="add-form" id="add-form">
          <label class="visually-hidden" for="color-input">Hex color value</label>
          <input id="color-input" type="text" inputmode="text" autocomplete="off" maxlength="7" placeholder="#A34F72" pattern="#?[0-9a-fA-F]{6}" aria-describedby="status-message" required>
          <button type="submit">Add color</button>
        </form>
        <button class="export-button" id="export-button" type="button">Export PNG</button>
      </div>

      <div class="palette" id="palette" aria-label="Color palette"></div>
      <p class="message" id="status-message" aria-live="polite"></p>
    </section>

    <footer><span>Web Programming · Week 4</span><span>DOM &amp; Events</span></footer>
  </main>

  <script>
    const startingColors = ['#E7D8C9', '#A8C7BB', '#D56B58', '#E7C84B', '#647C90', '#B7A1C8'];
    const palette = document.querySelector('#palette');
    const form = document.querySelector('#add-form');
    const input = document.querySelector('#color-input');
    const message = document.querySelector('#status-message');
    const colorCount = document.querySelector('#color-count');
    const exportButton = document.querySelector('#export-button');

    function readSavedColors() {
      try {
        const saved = JSON.parse(localStorage.getItem('interactive-color-palette') || 'null');
        if (Array.isArray(saved) && saved.every((color) => /^#[0-9a-f]{6}$/i.test(color))) return saved;
      } catch {
        message.textContent = 'Saved colors could not be loaded in this browser.';
      }
      return startingColors;
    }

    let colors = readSavedColors();

    function saveColors() {
      try {
        localStorage.setItem('interactive-color-palette', JSON.stringify(colors));
      } catch {
        message.textContent = 'This browser could not save your palette.';
      }
    }

    function textColorFor(hex) {
      const channels = hex.slice(1).match(/.{2}/g).map((channel) => Number.parseInt(channel, 16));
      const brightness = (channels[0] * 299 + channels[1] * 587 + channels[2] * 114) / 1000;
      return brightness > 150 ? '#17242b' : '#ffffff';
    }

    function renderPalette() {
      palette.replaceChildren();
      colors.forEach((color, index) => {
        const swatch = document.createElement('article');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = color;

        const code = document.createElement('span');
        code.className = 'swatch-code';
        code.textContent = color;
        code.style.color = textColorFor(color);

        const colorButton = document.createElement('button');
        colorButton.type = 'button';
        colorButton.className = 'swatch-color';
        colorButton.setAttribute('aria-label', `Show color value ${color}`);
        colorButton.setAttribute('aria-expanded', 'false');
        colorButton.appendChild(code);

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'swatch-remove';
        removeButton.textContent = '×';
        removeButton.title = 'Remove color';
        removeButton.setAttribute('aria-label', `Remove color ${color}`);

        colorButton.addEventListener('click', () => {
          const expanded = swatch.classList.toggle('expanded');
          colorButton.setAttribute('aria-expanded', String(expanded));
          colorButton.setAttribute('aria-label', `${expanded ? 'Hide' : 'Show'} color value ${color}`);
        });

        removeButton.addEventListener('click', () => {
          colors.splice(index, 1);
          saveColors();
          renderPalette();
          message.textContent = `${color} removed.`;
        });

        swatch.append(colorButton, removeButton);
        palette.appendChild(swatch);
      });

      colorCount.textContent = `${colors.length} ${colors.length === 1 ? 'color' : 'colors'}`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();
      const normalized = value.startsWith('#') ? value.toUpperCase() : `#${value.toUpperCase()}`;
      if (!/^#[0-9A-F]{6}$/.test(normalized)) {
        message.textContent = 'Enter a valid six-digit hex color, such as #A34F72.';
        input.focus();
        return;
      }

      colors.push(normalized);
      saveColors();
      renderPalette();
      message.textContent = `${normalized} added to your palette.`;
      input.value = '';
      input.focus();
    });

    exportButton.addEventListener('click', () => {
      if (!colors.length) {
        message.textContent = 'Add a color before exporting your palette.';
        return;
      }

      const columns = Math.min(colors.length, 3);
      const rows = Math.ceil(colors.length / columns);
      const cellWidth = 320;
      const cellHeight = 190;
      const padding = 24;
      const canvas = document.createElement('canvas');
      canvas.width = columns * cellWidth + padding * 2;
      canvas.height = rows * cellHeight + padding * 2;
      const context = canvas.getContext('2d');
      context.fillStyle = '#f1f3ed';
      context.fillRect(0, 0, canvas.width, canvas.height);

      colors.forEach((color, index) => {
        const x = padding + (index % columns) * cellWidth;
        const y = padding + Math.floor(index / columns) * cellHeight;
        context.fillStyle = color;
        context.fillRect(x, y, cellWidth - 12, cellHeight - 12);
        context.fillStyle = textColorFor(color);
        context.font = '700 22px monospace';
        context.fillText(color, x + 18, y + cellHeight - 34);
      });

      const download = document.createElement('a');
      download.download = 'my-color-palette.png';
      download.href = canvas.toDataURL('image/png');
      download.click();
      message.textContent = 'Palette exported as a PNG.';
    });

    renderPalette();
  </script>
</body>
</html>
