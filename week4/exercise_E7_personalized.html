<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise E7 - Personalized Portfolio</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --primary: #0f766e;
        --accent: #14b8a6;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }
      .profile {
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(15, 118, 110, 0.12);
        padding: 28px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 32px;
        font-weight: bold;
      }
      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      .tag {
        background: #ccfbf1;
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile">
        <div class="top">
          <div class="avatar">A</div>
          <div>
            <h1>A.Ruziboy</h1>
            <p>Web programmer</p>
          </div>
        </div>

        <p>currently i am building personal portfolio with CSS and HTML</p>

        <div class="skills">
          <span class="tag">HTML</span>
          <span class="tag">CSS</span>
          <span class="tag">PHP</span>
          <span class="tag">Python</span>
        </div>
      </div>
    </div>
  </body>
</html>
