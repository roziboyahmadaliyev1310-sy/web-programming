<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 11 - Advanced Flexbox</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: Arial, sans-serif;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #0f172a;
        color: white;
        padding: 16px 20px;
        gap: 12px;
      }
      .nav-links {
        display: flex;
        gap: 18px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div>Brand</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </body>
</html>
