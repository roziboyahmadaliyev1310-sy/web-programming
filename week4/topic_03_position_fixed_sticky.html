<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 03 - position: fixed & sticky</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #0f766e;
        color: white;
        padding: 16px 20px;
        z-index: 10;
      }
      .content {
        padding-top: 72px;
      }
      .sticky-header {
        position: sticky;
        top: 60px;
        background: #ccfbf1;
        border-left: 4px solid #14b8a6;
        padding: 12px 16px;
        font-weight: bold;
        color: #0f766e;
      }
      .section {
        height: 260px;
        margin: 20px;
        padding: 16px;
        background: #f0fdfa;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <nav class="nav">Fixed nav</nav>
    <div class="content">
      <div class="sticky-header">Sticky section label</div>
      <div class="section">Scroll down and the label stays in place while the section is in view.</div>
      <div class="sticky-header">Another sticky label</div>
      <div class="section">This is another content block.</div>
    </div>
  </body>
</html>
