<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search books from the Open Library catalog.">
  <title>Week 7 | Book Search</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26332d;
      --muted: #65756c;
      --paper: #f5f4ed;
      --surface: #fffefa;
      --line: #dedfd3;
      --accent: #286b54;
      --accent-dark: #1d503f;
      --soft: #e8f0e9;
      --error: #a63b32;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: radial-gradient(ellipse at 50% 0, #e8eddf 0, var(--paper) 60%);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 500;
      line-height: 1.1;
    }

    .intro {
      margin: 12px 0 26px;
      color: var(--muted);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgb(34 55 42 / 7%);
    }

    input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 10px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid #78a98e;
      outline-offset: 3px;
    }

    button {
      min-height: 48px;
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { cursor: wait; opacity: .7; }

    #status {
      min-height: 28px;
      margin: 22px 0 14px;
      color: var(--muted);
    }

    #status.error { color: var(--error); }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 14px;
    }

    .book {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 16px;
      min-height: 164px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
    }

    .cover, .cover-placeholder {
      width: 90px;
      height: 132px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--soft);
    }

    .cover-placeholder {
      display: grid;
      place-items: center;
      padding: 10px;
      color: var(--accent-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: .9rem;
      text-align: center;
    }

    .book h2 {
      margin: 2px 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.3;
    }

    .book p {
      margin: 5px 0;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 520px) {
      body { padding: 30px 16px; }
      form { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../index.html">← Home</a>
    <header>
      <p class="eyebrow">Week 7 · Fetch API</p>
      <h1>Find your next read.</h1>
      <p class="intro">Search the Open Library catalog by book title, author, or keyword.</p>
    </header>

    <form id="search-form">
      <label for="query" hidden>Book title, author, or keyword</label>
      <input id="query" name="query" type="search" placeholder="Try “The Hobbit” or “Ursula Le Guin”" required>
      <button id="search-button" type="submit">Search books</button>
    </form>

    <p id="status" role="status" aria-live="polite">Enter a title, author, or keyword to get started.</p>
    <section id="results" class="results" aria-label="Book search results"></section>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const searchButton = document.getElementById('search-button');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    function createBookCard(book) {
      const card = document.createElement('article');
      card.className = 'book';

      if (Number.isInteger(book.cover_i)) {
        const cover = document.createElement('img');
        cover.className = 'cover';
        cover.src = `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`;
        cover.alt = `Cover of ${book.title || 'book'}`;
        cover.loading = 'lazy';
        cover.onerror = () => {
          const placeholder = document.createElement('div');
          placeholder.className = 'cover-placeholder';
          placeholder.textContent = 'No cover available';
          placeholder.setAttribute('aria-label', 'No cover available');
          cover.replaceWith(placeholder);
        };
        card.append(cover);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'cover-placeholder';
        placeholder.textContent = 'No cover available';
        card.append(placeholder);
      }

      const details = document.createElement('div');
      const title = document.createElement('h2');
      title.textContent = book.title || 'Untitled';
      details.append(title);

      const author = document.createElement('p');
      author.textContent = book.author_name?.join(', ') || 'Author unknown';
      details.append(author);

      if (book.first_publish_year) {
        const year = document.createElement('p');
        year.textContent = `First published ${book.first_publish_year}`;
        details.append(year);
      }

      card.append(details);
      return card;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = queryInput.value.trim();
      if (!query) {
        queryInput.focus();
        return;
      }

      searchButton.disabled = true;
      status.className = '';
      status.textContent = 'Searching the catalog…';
      results.replaceChildren();

      try {
        const params = new URLSearchParams({
          q: query,
          fields: 'key,title,author_name,first_publish_year,cover_i',
          limit: '12'
        });
        const response = await fetch(`https://openlibrary.org/search.json?${params}`);
        if (!response.ok) {
          throw new Error(`The catalog returned HTTP ${response.status}`);
        }

        const data = await response.json();
        if (!Array.isArray(data.docs)) {
          throw new Error('The catalog response was not in the expected format');
        }
        if (data.docs.length === 0) {
          status.textContent = `No books found for “${query}”. Try another search.`;
          return;
        }

        results.append(...data.docs.map(createBookCard));
        status.textContent = `Showing ${data.docs.length} book${data.docs.length === 1 ? '' : 's'} for “${query}”.`;
      } catch (error) {
        status.className = 'error';
        status.textContent = `Could not search the catalog: ${error.message}. Check your connection and try again.`;
      } finally {
        searchButton.disabled = false;
      }
    });
  </script>
</body>
</html>
