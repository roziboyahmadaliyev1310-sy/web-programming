<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice 5 | Fetch Steps</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="back-link" href="../index.html">← Week 6</a>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
    </header>
    <main class="lesson-wrap">
      <div class="lesson-header">
        <span class="page-badge">Practice 5</span>
        <h1>Order the fetch steps</h1>
        <p class="meta">Choose what should happen at each point in a typical JSON request.</p>
      </div>
      <form id="sequenceForm">
        <ol class="checklist">
          <li>
            <label for="step1"><strong>First</strong></label>
            <select id="step1" required>
              <option value="">Choose an action</option>
              <option value="fetch">Send the request with fetch(url)</option>
              <option value="render">Render the data on the page</option>
              <option value="json">Parse the response body as JSON</option>
              <option value="check">Check response.ok</option>
            </select>
          </li>
          <li>
            <label for="step2"><strong>Next</strong></label>
            <select id="step2" required>
              <option value="">Choose an action</option>
              <option value="fetch">Send the request with fetch(url)</option>
              <option value="render">Render the data on the page</option>
              <option value="json">Parse the response body as JSON</option>
              <option value="check">Check response.ok</option>
            </select>
          </li>
          <li>
            <label for="step3"><strong>Then</strong></label>
            <select id="step3" required>
              <option value="">Choose an action</option>
              <option value="fetch">Send the request with fetch(url)</option>
              <option value="render">Render the data on the page</option>
              <option value="json">Parse the response body as JSON</option>
              <option value="check">Check response.ok</option>
            </select>
          </li>
          <li>
            <label for="step4"><strong>Finally</strong></label>
            <select id="step4" required>
              <option value="">Choose an action</option>
              <option value="fetch">Send the request with fetch(url)</option>
              <option value="render">Render the data on the page</option>
              <option value="json">Parse the response body as JSON</option>
              <option value="check">Check response.ok</option>
            </select>
          </li>
        </ol>
        <button class="action-button" type="submit">Check sequence</button>
        <button class="action-button secondary" id="resetSequence" type="button">Reset</button>
        <p id="sequenceFeedback" class="status" aria-live="polite"></p>
      </form>
      <div class="note">Remember: check <code>response.ok</code> before parsing data, because an HTTP error such as 404 does not automatically reject <code>fetch()</code>.</div>
      <nav class="lesson-nav" aria-label="Practice navigation">
        <a href="practice-04-promise-states.html">← Promise states</a>
        <a href="practice-06-async-await.html">Async/await →</a>
      </nav>
    </main>
  </div>
  <script src="../script.js"></script>
  <script>
    const sequenceForm = document.getElementById('sequenceForm');
    const sequenceFeedback = document.getElementById('sequenceFeedback');
    const sequenceSelects = [...sequenceForm.querySelectorAll('select')];
    const correctSequence = ['fetch', 'check', 'json', 'render'];

    sequenceForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const answers = sequenceSelects.map((select) => select.value);
      const correct = answers.every((answer, index) => answer === correctSequence[index]);
      sequenceFeedback.className = `status ${correct ? 'correct' : 'incorrect'}`;
      sequenceFeedback.textContent = correct
        ? 'Correct! Request, check the HTTP status, parse JSON, then render the data.'
        : 'Not quite. Review the response and status check, then try again.';
    });

    document.getElementById('resetSequence').addEventListener('click', () => {
      sequenceForm.reset();
      sequenceFeedback.className = 'status';
      sequenceFeedback.textContent = '';
    });
  </script>
</body>
</html>
