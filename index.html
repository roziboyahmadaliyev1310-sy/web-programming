<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Web Programming assignments and class exercises by Ruziboy." />
  <title>Web Programming | Ruziboy | 202539434</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #27313a;
      --muted: #65717b;
      --paper: #f3f5f4;
      --surface: #ffffff;
      --line: #dce2df;
      --accent: #26715f;
      --accent-soft: #e4f0eb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 0%, #e3ece7 0%, var(--paper) 58%);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      text-align: center;
      animation: arrive 550ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 500;
      line-height: 1.08;
    }

    .intro {
      margin: 14px 0 30px;
      color: var(--muted);
      line-height: 1.6;
    }

    nav {
      display: grid;
      gap: 11px;
    }

    nav a {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 1rem;
      font-weight: 650;
      text-align: left;
      text-decoration: none;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    nav a::after {
      content: "→";
      color: var(--accent);
      font-size: 1.2rem;
    }

    nav a:hover, nav a:focus-visible {
      transform: translateY(-2px);
      border-color: #9bbcaf;
      background: var(--accent-soft);
      outline: none;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Class exercises · 2026</p>
    <h1>Web Programming</h1>
    <p class="intro">My Web Programming assignments and class exercises</p>

    <nav aria-label="Course weeks">
      <a href="week1/index.html">Week 1</a>
      <a href="week2/index.html">Week 2</a>
      <a href="week3/index.html">Week 3</a>
      <a href="week3friday/index.html">Week 3 Friday</a>
    </nav>

  </main>
</body>
</html>
