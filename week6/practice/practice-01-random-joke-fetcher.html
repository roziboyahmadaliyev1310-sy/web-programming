<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Practice 1 | Random Joke Fetcher</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="back-link" href="../index.html">← Week 6</a>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
    </header>

    <main class="lesson-wrap">
      <div class="lesson-header">
        <span class="page-badge">Practice</span>
        <h1>Random Joke Fetcher</h1>
        <p class="meta">Fetch data from the internet and show it on the page.</p>
      </div>

      <div class="demo-box">
        <button id="jokeBtn" class="action-button" type="button">Load a Joke</button>
        <div id="jokeOut">
          <div id="jokeSetup">Loading…</div>
          <div id="jokePunch"></div>
        </div>
        <div id="status" class="status">Ready</div>
      </div>

      <div class="note">
        This practice uses <code>fetch()</code>, <code>await</code>, and a fallback message if the request fails.
      </div>
    </main>
  </div>

  <script src="../script.js"></script>
  <script>
    const jokeBtn = document.getElementById('jokeBtn');
    const jokeOut = document.getElementById('jokeOut');
    const jokeSetup = document.getElementById('jokeSetup');
    const jokePunch = document.getElementById('jokePunch');
    const status = document.getElementById('status');

    const fallbackJoke = {
      setup: 'Why do programmers prefer dark mode?',
      punchline: 'Because light attracts bugs.'
    };

    async function loadJoke() {
      jokeBtn.disabled = true;
      jokeBtn.textContent = 'Loading…';
      status.textContent = 'Fetching a joke…';
      jokeOut.style.display = 'block';
      jokeSetup.textContent = 'Asking the server for a joke…';
      jokePunch.textContent = '';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const response = await fetch('https://official-joke-api.appspot.com/random_joke', {
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        jokeSetup.textContent = data.setup;
        jokePunch.textContent = data.punchline;
        status.textContent = 'Success: joke loaded';
      } catch (error) {
        jokeSetup.textContent = fallbackJoke.setup;
        jokePunch.textContent = fallbackJoke.punchline;
        status.textContent = error.name === 'AbortError'
          ? 'The request timed out — showing a fallback joke'
          : 'Offline or API error — showing a fallback joke';
      } finally {
        clearTimeout(timeoutId);
        jokeBtn.disabled = false;
        jokeBtn.textContent = 'Load Another Joke';
      }
    }

    jokeBtn.addEventListener('click', loadJoke);
  </script>
</body>
</html>
