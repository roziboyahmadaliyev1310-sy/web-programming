<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Practice 1 | Random Joke Fetcher</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="back-link" href="../index.html">← Week 6</a>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
    </header>

    <main class="lesson-wrap">
      <div class="lesson-header">
        <span class="page-badge">Practice</span>
        <h1>Random Joke Fetcher</h1>
        <p class="meta">Fetch data from the internet and show it on the page.</p>
      </div>

      <div class="demo-box">
        <div class="button-row">
          <button id="jokeBtn" class="action-button" type="button">Load a Joke</button>
          <button id="saveBtn" class="action-button secondary" type="button" disabled>Save Favourite</button>
        </div>
        <p id="loading" class="status hidden"><span class="spinner" aria-hidden="true"></span>Loading a joke…</p>
        <div id="jokeOut">
          <div id="jokeSetup">Loading…</div>
          <div id="jokePunch"></div>
        </div>
        <div id="status" class="status">Ready</div>
      </div>

      <section class="demo-box" aria-labelledby="favorites-heading">
        <h2 id="favorites-heading">Favourite jokes</h2>
        <p id="favorites-empty">No saved jokes yet.</p>
        <ul id="favorites" class="favorite-list"></ul>
      </section>

      <div class="note">
        This practice uses <code>fetch()</code>, <code>await</code>, error handling, a loading spinner, and <code>localStorage</code> for saved favourites.
      </div>
    </main>
  </div>

  <script src="../script.js"></script>
  <script src="practice-01.js"></script>
</body>
</html>
