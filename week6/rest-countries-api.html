<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Search | Week 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container country-page">
    <section class="country-search-card" aria-labelledby="page-title">
      <header class="country-header">
        <a class="back-link" href="index.html">← All projects</a>
        <button class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
        <h1 id="page-title">Country Search</h1>
      </header>
      <form class="country-search-form" data-country-search>
        <label class="key-label" for="countryName">Country name</label>
        <div class="country-search-controls">
          <input class="api-key-input country-name-input" id="countryName" name="country" type="search" placeholder="e.g. China" autocomplete="off" required />
          <button class="action-button country-search-button" type="submit" data-api="countries">Search</button>
        </div>
      </form>
      <div class="country-result api-result" id="result-countries" aria-live="polite" aria-atomic="true"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
