<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Exercise E4
  </title>
  <style>:root {
    --bg: #ffffff;
    --text: #0f766e;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0f766e;
        --text: #ffffff;
    }
}
body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: 20px;
}</style>
 </head>
 <body>
  <h1>
   Theme Switcher via CSS Variables
  </h1>
 </body>
</html>
