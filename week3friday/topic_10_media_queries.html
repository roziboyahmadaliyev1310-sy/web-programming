<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Topic 10: CSS Media Queries
  </title>
  <style>body {
    background: #f0fdfa;
    font-family: sans-serif;
}
@media (min-width: 640px) {
    body {
        background: #ccfbf1;
    }
}</style>
 </head>
 <body>
  <p>
   Resize browser window to see background change color.
  </p>
 </body>
</html>
