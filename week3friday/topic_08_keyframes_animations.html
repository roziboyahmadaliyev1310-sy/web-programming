<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 08: CSS Animations &amp; @keyframes
  </title>
  <style>@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.1);
    }
}
.badge {
    display: inline-block;
    background: #0f766e;
    color: white;
    padding: 6px 16px;
    border-radius: 20px;
    animation: pulse 1.5s infinite;
}</style>
 </head>
 <body>
  <span class="badge">
   Live Animation
  </span>
 </body>
</html>
