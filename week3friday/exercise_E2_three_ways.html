<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>

  <style>.card {
    width: 200px;
    padding: 20px;
    background: #f0fdfa;
    border: 2px solid #14b8a6;
    border-radius: 8px;
    transition: transform 0.2s, background 0.2s;
}
.card:hover {
    transform: translateY(-4px);
    background: #ccfbf1;
}</style>
 </head>
 <body>
  <div class="card">
   Hover Card
  </div>
 </body>
