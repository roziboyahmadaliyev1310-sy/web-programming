<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 05 - Pseudo Classes</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
      }
      h1 {
        margin-top: 0;
      }
      .btn {
        background: #0f766e;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s ease;
      }
      .btn:hover {
        background: #0b5d56;
      }
      .btn:active {
        transform: scale(0.97);
      }
      input {
        padding: 10px 12px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        display: block;
        margin-top: 6px;
      }
      input:focus-visible, .btn:focus-visible {
        border-color: #0f766e;
        outline: 3px solid #b45309;
        outline-offset: 3px;
      }
      label {
        display: block;
        margin-top: 20px;
      }
      li:first-child {
        color: #0f766e;
        font-weight: bold;
      }
      li:last-child {
        color: #b93800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pseudo Classes</h1>
      <button class="btn" type="button">Hover me</button>
      <label for="focus-demo">Focus here</label>
      <input id="focus-demo" type="text" />

      <ul>
        <li>First child</li>
        <li>Second child</li>
        <li>Third child</li>
      </ul>
    </main>
  </body>
</html>
