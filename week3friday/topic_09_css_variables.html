<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 09: CSS Variables
  </title>
  <style>:root {
    --primary: #0f766e;
    --accent: #14b8a6;
}
.btn {
    background: var(--primary);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
}</style>
 </head>
 <body>
  <button class="btn">
   Variable Styled Button
  </button>
 </body>
</html>
