<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise E4 - CSS Variables</title>
    <style>
      :root {
        --primary: #0f766e;
        --accent: #14b8a6;
        --light: #ecfeff;
        --dark: #1f2937;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--light);
        color: var(--dark);
        padding: 32px;
      }
      .theme-box {
        background: white;
        border: 2px solid var(--primary);
        border-radius: 12px;
        padding: 24px;
      }
      .button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="theme-box">
      <h2>Theme Example</h2>
      <p>CSS variables make theme updates easy.</p>
      <button class="button">Primary Button</button>
    </div>
  </body>
</html>
