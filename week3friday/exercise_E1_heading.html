<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise E1 - Position the Badge</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
      }
      .card {
        position: relative;
        width: 260px;
        background: #f8fafc;
        border: 2px solid #0f766e;
        border-radius: 12px;
        padding: 22px;
      }
      .badge {
        position: absolute;
        top: -12px;
        right: -12px;
        background: #0f766e;
        color: white;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">New</span>
      <h2>Card Title</h2>
      <p>Position the badge on the top-right corner.</p>
    </div>
  </body>
</html>
