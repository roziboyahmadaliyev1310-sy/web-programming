<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 18: Responsive Grid
  </title>
  <style>.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    padding: 10px;
}
.card {
    background: #14b8a6;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 8px;
}</style>
 </head>
 <body>
  <div class="grid">
   <div class="card">
    1
   </div>
   <div class="card">
    2
   </div>
  </div>
 </body>
</html>
