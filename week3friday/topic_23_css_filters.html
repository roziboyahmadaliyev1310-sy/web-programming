<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 23: CSS Filters
  </title>
  <style>.box {
    width: 120px;
    height: 120px;
    background: #14b8a6;
    filter: blur(2px) grayscale(50%);
    transition: filter 0.3s;
}
.box:hover {
    filter: blur(0) grayscale(0%);
}</style>
 </head>
 <body>
  <div class="box">
  </div>
 </body>
</html>
