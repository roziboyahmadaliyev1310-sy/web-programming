<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 12: CSS Grid
  </title>
  <style>.grid-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}
.grid-item {
    background: #0f766e;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 8px;
}</style>
 </head>
 <body>
  <div class="grid-container">
   <div class="grid-item">
    1
   </div>
   <div class="grid-item">
    2
   </div>
  </div>
 </body>
</html>
