<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 06: Pseudo-elements ::before &amp; ::after
  </title>
  <style>h2::before {
    content: '🌿 ';
}
.required::after {
    content: ' *';
    color: #f43f5e;
    font-weight: bold;
}</style>
 </head>
 <body>
  <h2>
   CSS Pseudo-elements
  </h2>
  <label class="required">
   Required Field
  </label>
 </body>
</html>
