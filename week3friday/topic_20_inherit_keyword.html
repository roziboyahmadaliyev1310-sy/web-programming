<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 20: inherit Keyword
  </title>
  <style>.parent {
    color: #0f766e;
    border: 2px dashed #0f766e;
    padding: 15px;
}
.child {
    color: inherit;
    border: inherit;
    padding: 10px;
}</style>
 </head>
 <body>
  <div class="parent">
   Parent
   <div class="child">
    Child Inheriting
   </div>
  </div>
 </body>
</html>
