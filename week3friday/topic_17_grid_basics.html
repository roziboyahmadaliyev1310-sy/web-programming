<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 17: CSS Grid Basics
  </title>
  <style>.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #f0fdfa;
    padding: 10px;
}
.grid-item {
    background: #0f766e;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 6px;
}</style>
 </head>
 <body>
  <div class="grid">
   <div class="grid-item">
    1
   </div>
   <div class="grid-item">
    2
   </div>
   <div class="grid-item">
    3
   </div>
  </div>
 </body>
</html>
