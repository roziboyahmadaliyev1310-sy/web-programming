<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic 15 - Putting It All Together</title>
    <style>
      :root {
        --primary: #0f766e;
        --bg: #f0fdfa;
        --card: #ffffff;
        --accent: #14b8a6;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
      }
      .nav {
        position: sticky;
        top: 0;
        background: var(--primary);
        color: white;
        padding: 16px 20px;
        z-index: 5;
      }
      .hero {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 220px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: white;
        text-align: center;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        padding: 28px;
      }
      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 8px 18px rgba(15, 118, 110, 0.15);
        transition: transform 0.2s ease;
      }
      .card:hover {
        transform: translateY(-6px);
      }
      .badge {
        display: inline-block;
        background: #ccfbf1;
        color: var(--primary);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav class="nav">Advanced CSS Demo</nav>

    <section class="hero">
      <div>
        <h1>Complete Layout Example</h1>
        <p>Sticky nav, grid, hover effects, colors, and transitions.</p>
      </div>
    </section>

    <section class="cards">
      <div class="card">
        <span class="badge">Layout</span>
        <h3>Grid</h3>
        <p>Responsive columns adjusted by screen size.</p>
      </div>
      <div class="card">
        <span class="badge">Style</span>
        <h3>Variables</h3>
        <p>Colors are consistent and easy to update.</p>
      </div>
      <div class="card">
        <span class="badge">Motion</span>
        <h3>Transitions</h3>
        <p>Hover effects create a polished feel.</p>
      </div>
    </section>
  </body>
</html>
