<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seven interactive React state and event exercises." />
    <title>Week 11_2 · React State &amp; Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --green-900: #123b2b;
        --green-600: #25845a;
        --green-100: #e7f5ec;
        --white: #ffffff;
        --text: #19251d;
        --muted: #527060;
        --line: rgba(18, 59, 43, 0.14);
        --shadow: 0 18px 48px rgba(18, 59, 43, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--green-100);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        line-height: 1.55;
      }

      button, input, textarea { font: inherit; }
      button { color: inherit; }
      a { color: inherit; }

      button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
        outline: 3px solid var(--green-600);
        outline-offset: 3px;
      }

      .app-shell { width: min(1380px, 100%); margin: 0 auto; padding: 26px clamp(16px, 4vw, 52px) 52px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 10px; color: var(--green-900); font-weight: 800; }
      .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--green-900); color: var(--white); font-size: 1.15rem; }
      .home-link { color: var(--green-900); font-size: .9rem; font-weight: 700; text-decoration: none; }
      .home-link:hover { color: var(--green-600); }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 24px;
        margin: 34px 0 24px;
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: var(--white);
        box-shadow: var(--shadow);
      }

      .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--green-600); font-size: .78rem; font-weight: 800; letter-spacing: .08em; }
      .eyebrow::before { width: 9px; height: 9px; border-radius: 50%; background: var(--green-600); content: ""; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { max-width: 720px; margin-bottom: 12px; color: var(--green-900); font: 800 clamp(2.4rem, 6vw, 4.5rem)/1.02 "Manrope", sans-serif; letter-spacing: -.06em; }
      .hero-copy { max-width: 650px; margin-bottom: 0; color: var(--muted); font-size: 1.05rem; }
      .hero-count { display: grid; width: 112px; height: 112px; place-items: center; align-content: center; border: 1px solid var(--line); border-radius: 50%; background: var(--green-100); color: var(--green-900); text-align: center; transform: rotate(7deg); }
      .hero-count strong { display: block; font: 800 2rem/1 "Manrope", sans-serif; }
      .hero-count span { margin-top: 5px; font-size: .72rem; font-weight: 700; }

      .workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); align-items: start; gap: 22px; }
      .sidebar, .work-card { border: 1px solid var(--line); border-radius: 26px; background: var(--white); box-shadow: var(--shadow); }
      .sidebar { position: sticky; top: 18px; padding: 16px; }
      .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 14px; }
      .sidebar-heading h2 { margin: 0; color: var(--green-900); font: 800 1rem "Manrope", sans-serif; }
      .progress-pill { padding: 5px 10px; border-radius: 999px; background: var(--green-100); color: var(--green-900); font-size: .74rem; font-weight: 800; }
      .exercise-nav { display: grid; gap: 7px; }
      .nav-item { display: grid; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; gap: 10px; width: 100%; padding: 9px; border: 1px solid transparent; border-radius: 17px; background: var(--white); text-align: left; cursor: pointer; transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease; }
      .nav-item:hover { transform: translateX(2px); background: var(--green-100); }
      .nav-item.active { border-color: var(--green-600); background: var(--green-100); }
      .nav-number { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--green-900); color: var(--white); font-size: .78rem; font-weight: 800; }
      .nav-copy { min-width: 0; }
      .nav-title { display: block; color: var(--green-900); font-size: .85rem; font-weight: 800; line-height: 1.25; }
      .nav-goal { display: block; overflow: hidden; margin-top: 3px; color: var(--muted); font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
      .nav-check { color: var(--green-600); font-size: 1rem; font-weight: 900; }
      .sidebar-note { margin: 15px 7px 4px; padding-top: 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }

      .work-card { min-width: 0; overflow: hidden; }
      .exercise-head { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 15px; padding: clamp(20px, 4vw, 34px); border-bottom: 1px solid var(--line); }
      .exercise-mark { display: grid; width: 58px; height: 58px; place-items: center; border-radius: 20px; background: var(--green-900); color: var(--white); font: 800 1rem "Manrope", sans-serif; }
      .exercise-label { margin: 0 0 4px; color: var(--green-600); font-size: .74rem; font-weight: 800; }
      .exercise-head h2 { margin: 0; color: var(--green-900); font: 800 clamp(1.35rem, 3vw, 2rem)/1.2 "Manrope", sans-serif; letter-spacing: -.04em; }
      .goal-pill { max-width: 170px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--green-900); font-size: .72rem; font-weight: 800; text-align: center; }
      .exercise-body { padding: clamp(20px, 4vw, 34px); }
      .hint { margin: 0 0 20px; color: var(--muted); }
      .demo-panel { padding: clamp(19px, 4vw, 30px); border: 1px solid var(--line); border-radius: 24px; background: var(--white); }
      .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .panel-top h3 { margin: 0; color: var(--green-900); font: 800 1rem "Manrope", sans-serif; }
      .live-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; background: var(--green-100); color: var(--green-900); font-size: .75rem; font-weight: 800; }
      .live-pill::before { width: 7px; height: 7px; border-radius: 50%; background: var(--green-600); content: ""; }

      .counter-display { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 21px; }
      .counter-value { color: var(--green-900); font: 800 clamp(4rem, 14vw, 7rem)/.95 "Manrope", sans-serif; letter-spacing: -.08em; }
      .counter-caption { max-width: 180px; color: var(--muted); font-size: .9rem; }
      .button-row { display: flex; flex-wrap: wrap; gap: 10px; }
      .button { min-height: 44px; padding: 10px 17px; border: 1px solid var(--green-900); border-radius: 999px; background: var(--green-900); color: var(--white); font-weight: 800; cursor: pointer; transition: transform 150ms ease, background-color 150ms ease, box-shadow 150ms ease; }
      .button:hover { transform: translateY(-2px); background: var(--green-600); box-shadow: 0 7px 16px rgba(18, 59, 43, .14); }
      .button:active { transform: translateY(0); }
      .button.secondary { background: var(--white); color: var(--green-900); }
      .button.secondary:hover { background: var(--green-100); }
      .button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
      .text-input, .text-area { width: 100%; border: 1px solid var(--line); border-radius: 15px; background: var(--white); color: var(--text); padding: 13px 15px; transition: border-color 150ms ease, box-shadow 150ms ease; }
      .text-input:focus, .text-area:focus { border-color: var(--green-600); box-shadow: 0 0 0 4px var(--green-100); outline: none; }
      .text-area { min-height: 150px; resize: vertical; }
      .field-label { display: block; margin-bottom: 7px; color: var(--green-900); font-size: .85rem; font-weight: 800; }
      .preview { margin: 18px 0 0; padding: 16px 18px; border-radius: 16px; background: var(--green-100); color: var(--green-900); font-size: 1.05rem; }
      .preview strong { font-weight: 800; }
      .list-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
      .item-list, .todo-list { display: grid; gap: 9px; margin: 18px 0 0; padding: 0; list-style: none; }
      .list-row, .todo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
      .list-row span { overflow-wrap: anywhere; }
      .empty-state { margin: 16px 0 0; padding: 17px; border-radius: 16px; background: var(--green-100); color: var(--muted); text-align: center; }
      .icon-button { display: grid; min-width: 40px; min-height: 40px; place-items: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--green-900); font-weight: 800; cursor: pointer; transition: background-color 150ms ease, transform 150ms ease; }
      .icon-button:hover { transform: scale(1.04); background: var(--green-100); }
      .reveal-button { min-width: 150px; }
      .reveal-content { margin: 17px 0 0; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--green-100); color: var(--green-900); animation: appear 180ms ease-out; }
      .reveal-content p:last-child { margin-bottom: 0; }
      .filter-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
      .filter-button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--green-900); font-size: .82rem; font-weight: 800; cursor: pointer; }
      .filter-button[aria-pressed="true"] { border-color: var(--green-900); background: var(--green-900); color: var(--white); }
      .todo-row { justify-content: flex-start; }
      .todo-row label { display: flex; flex: 1; align-items: center; gap: 11px; min-width: 0; cursor: pointer; }
      .todo-row input[type="checkbox"] { width: 19px; height: 19px; flex: 0 0 auto; accent-color: var(--green-600); }
      .todo-text { overflow-wrap: anywhere; }
      .todo-row.done .todo-text { color: var(--muted); text-decoration: line-through; }
      .form-grid { display: grid; gap: 16px; }
      .field-error, .form-message { margin: 9px 0 0; color: var(--green-900); font-size: .85rem; font-weight: 700; }
      .form-message { padding: 12px 15px; border-radius: 14px; background: var(--green-100); }
      .note-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
      .save-status { display: inline-flex; align-items: center; gap: 8px; color: var(--green-900); font-size: .86rem; font-weight: 800; }
      .save-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green-600); }
      .example-details { margin-top: 20px; border-top: 1px solid var(--line); }
      .example-details summary { display: inline-flex; align-items: center; gap: 9px; padding: 16px 0 4px; color: var(--green-900); font-weight: 800; cursor: pointer; list-style: none; }
      .example-details summary::-webkit-details-marker { display: none; }
      .example-details summary::before { content: "＋"; display: grid; width: 23px; height: 23px; place-items: center; border-radius: 50%; background: var(--green-100); color: var(--green-900); }
      .example-details[open] summary::before { content: "−"; }
      .code-wrap { overflow: auto; margin: 13px 0 0; border-radius: 18px; background: var(--green-900); color: var(--white); }
      pre { margin: 0; padding: 20px; font: .82rem/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
      .bottom-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
      .nav-step { padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--green-900); font-weight: 800; cursor: pointer; }
      .nav-step:hover:not(:disabled) { background: var(--green-100); }

      @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 820px) {
        .workspace { grid-template-columns: 1fr; }
        .sidebar { position: static; }
        .exercise-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .sidebar-note { display: none; }
      }
      @media (max-width: 560px) {
        .app-shell { padding-top: 16px; }
        .hero { grid-template-columns: 1fr; margin-top: 23px; }
        .hero-count { width: 78px; height: 78px; }
        .hero-count strong { font-size: 1.5rem; }
        .exercise-nav { grid-template-columns: 1fr; }
        .exercise-head { grid-template-columns: 48px minmax(0, 1fr); gap: 11px; }
        .exercise-mark { width: 48px; height: 48px; border-radius: 17px; }
        .goal-pill { display: none; }
        .counter-display { align-items: flex-start; flex-direction: column; }
        .list-form { grid-template-columns: 1fr; }
        .list-form .button { width: 100%; }
        .note-footer { align-items: flex-start; flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useState } = React;

      const exercises = [
        { id: 1, title: "Update state with a counter", short: "Counter", goal: "Functional updates", description: "Use a functional state update so each click uses the latest count." },
        { id: 2, title: "Keep an input in sync", short: "Live input", goal: "Controlled input", description: "Keep the input value in state and reflect it in a live greeting." },
        { id: 3, title: "Add and remove list items", short: "List updates", goal: "Immutable arrays", description: "Add and remove items without mutating the array, using stable IDs." },
        { id: 4, title: "Show and hide content", short: "Toggle details", goal: "Boolean state", description: "Toggle content accessibly and keep aria-expanded in sync." },
        { id: 5, title: "Complete and filter tasks", short: "Task list", goal: "Filter state", description: "Check tasks, filter by status, and clear completed tasks." },
        { id: 6, title: "Validate a controlled form", short: "Form validation", goal: "Object state", description: "Store the name and email together, then validate after submit." },
        { id: 7, title: "Save a note in the browser", short: "Saved note", goal: "Effect + storage", description: "Persist a note in localStorage and restore it on the next visit." }
      ];

      const examples = {
        1: `function Counter() {
  const [count, setCount] = useState(0);

  return (
    <>
      <p>{count}</p>
      <button onClick={() => setCount(value => value - 1)}>Decrease</button>
      <button onClick={() => setCount(value => value + 1)}>Add one</button>
      <button onClick={() => setCount(0)}>Reset</button>
    </>
  );
}`,
        2: `function GreetingInput() {
  const [name, setName] = useState("");

  return (
    <>
      <input value={name} onChange={event => setName(event.target.value)} />
      <p>Hello, {name.trim() || "there"}!</p>
    </>
  );
}`,
        3: `function ItemList() {
  const [items, setItems] = useState([]);
  const [text, setText] = useState("");

  function addItem(event) {
    event.preventDefault();
    const label = text.trim();
    if (!label) return;
    setItems(current => [...current, { id: crypto.randomUUID(), label }]);
    setText("");
  }

  function removeItem(id) {
    setItems(current => current.filter(item => item.id !== id));
  }

  return (
    <form onSubmit={addItem}>
      <input value={text} onChange={event => setText(event.target.value)} />
      <button>Add</button>
      {items.map(item => (
        <div key={item.id}>
          {item.label} <button type="button" onClick={() => removeItem(item.id)}>Remove</button>
        </div>
      ))}
    </form>
  );
}`,
        4: `function DetailsToggle() {
  const [isOpen, setIsOpen] = useState(false);

  return (
    <>
      <button aria-expanded={isOpen} onClick={() => setIsOpen(open => !open)}>
        {isOpen ? "Hide details" : "Show details"}
      </button>
      {isOpen && <p>Extra information is visible.</p>}
    </>
  );
}`,
        5: `function TaskList() {
  const [tasks, setTasks] = useState([
    { id: 1, text: "Read the React lesson", done: false }
  ]);
  const [filter, setFilter] = useState("All");
  const visible = tasks.filter(task =>
    filter === "All" || (filter === "Done" ? task.done : !task.done)
  );

  function toggleTask(id) {
    setTasks(current => current.map(task =>
      task.id === id ? { ...task, done: !task.done } : task
    ));
  }

  function clearCompleted() {
    setTasks(current => current.filter(task => !task.done));
  }

  return (
    <>
      {["All", "Active", "Done"].map(option => (
        <button key={option} onClick={() => setFilter(option)}>{option}</button>
      ))}
      {visible.map(task => (
        <label key={task.id}>
          <input type="checkbox" checked={task.done}
            onChange={() => toggleTask(task.id)} />
          {task.text}
        </label>
      ))}
      <button onClick={clearCompleted}>Clear completed</button>
    </>
  );
}`,
        6: `function ContactForm() {
  const [form, setForm] = useState({ name: "", email: "" });
  const [message, setMessage] = useState("");

  function updateField(event) {
    const { name, value } = event.target;
    setForm(current => ({ ...current, [name]: value }));
  }

  function submit(event) {
    event.preventDefault();
    if (!form.name.trim() || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(form.email)) {
      setMessage("Enter your name and a valid email address.");
      return;
    }
    setMessage("Thanks! Your form is valid.");
  }

  return (
    <form onSubmit={submit}>
      <input name="name" value={form.name} onChange={updateField} required />
      <input name="email" type="email" value={form.email}
        onChange={updateField} required />
      <button type="submit">Submit</button>
      <p role="status">{message}</p>
    </form>
  );
}`,
        7: `function SavedNote() {
  const [note, setNote] = useState(() => localStorage.getItem("week11-note") || "");

  useEffect(() => {
    if (note.trim()) localStorage.setItem("week11-note", note);
    else localStorage.removeItem("week11-note");
  }, [note]);

  return (
    <>
      <textarea value={note} onChange={event => setNote(event.target.value)} />
      <p>{note.trim() ? "Saved ✓" : "Nothing saved yet"}</p>
      <button onClick={() => setNote("")}>Clear</button>
    </>
  );
}`
      };

      function App() {
        const [activeId, setActiveId] = useState(1);
        const [visited, setVisited] = useState([1]);
        const [count, setCount] = useState(0);
        const [name, setName] = useState("");
        const [itemText, setItemText] = useState("");
        const [items, setItems] = useState([]);
        const [detailsOpen, setDetailsOpen] = useState(false);
        const [tasks, setTasks] = useState([
          { id: "learn", text: "Read the React lesson", done: true },
          { id: "counter", text: "Try the counter", done: false },
          { id: "list", text: "Update the task list", done: false }
        ]);
        const [taskFilter, setTaskFilter] = useState("All");
        const [form, setForm] = useState({ name: "", email: "" });
        const [formMessage, setFormMessage] = useState("");
        const [note, setNote] = useState("");
        const [noteLoaded, setNoteLoaded] = useState(false);
        const [noteStatus, setNoteStatus] = useState("Loading saved note…");

        // Restore once before the second effect begins persisting edits.
        useEffect(() => {
          try {
            const savedNote = window.localStorage.getItem("week11-2-note");
            if (savedNote !== null) setNote(savedNote);
            else setNoteStatus("Nothing saved yet");
          } catch {
            setNoteStatus("Browser storage is unavailable");
          } finally {
            setNoteLoaded(true);
          }
        }, []);

        useEffect(() => {
          if (!noteLoaded) return;
          try {
            if (note.trim()) {
              window.localStorage.setItem("week11-2-note", note);
              setNoteStatus("Saved ✓");
            } else {
              window.localStorage.removeItem("week11-2-note");
              setNoteStatus("Nothing saved yet");
            }
          } catch {
            setNoteStatus("Could not save in this browser");
          }
        }, [note, noteLoaded]);

        const activeExercise = exercises.find(exercise => exercise.id === activeId);
        const filteredTasks = tasks.filter(task =>
          taskFilter === "All" || (taskFilter === "Done" ? task.done : !task.done)
        );
        const completedCount = tasks.filter(task => task.done).length;

        function selectExercise(id) {
          setActiveId(id);
          setVisited(current => current.includes(id) ? current : [...current, id]);
        }

        function addItem(event) {
          event.preventDefault();
          const label = itemText.trim();
          if (!label) return;
          // Give each list entry a stable key and append without mutating state.
          const id = typeof crypto !== "undefined" && crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          setItems(current => [...current, { id, label }]);
          setItemText("");
        }

        function updateForm(event) {
          const { name: fieldName, value } = event.target;
          setForm(current => ({ ...current, [fieldName]: value }));
          setFormMessage("");
        }

        function submitForm(event) {
          event.preventDefault();
          const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim());
          if (!form.name.trim() || !validEmail) {
            setFormMessage("Please enter your name and a valid email address.");
            return;
          }
          setFormMessage(`Thanks, ${form.name.trim()}! Your form is valid.`);
        }

        function renderExercise() {
          switch (activeId) {
            case 1:
              return <div className="demo-panel">
                <div className="panel-top"><h3>Counter playground</h3><span className="live-pill">State updates live</span></div>
                <div className="counter-display"><output className="counter-value" aria-live="polite">{count}</output><p className="counter-caption">Each button uses the latest value, even across quick clicks.</p></div>
                <div className="button-row">
                  <button className="button secondary" onClick={() => setCount(value => value - 1)}>Decrease</button>
                  <button className="button" onClick={() => setCount(value => value + 1)}>Add one</button>
                  <button className="button secondary" onClick={() => setCount(0)}>Reset</button>
                </div>
              </div>;
            case 2:
              return <div className="demo-panel">
                <div className="panel-top"><h3>Your greeting</h3><span className="live-pill">Controlled input</span></div>
                <label className="field-label" htmlFor="greeting-name">Your name</label>
                <input className="text-input" id="greeting-name" value={name} onChange={event => setName(event.target.value)} placeholder="Type a name" />
                <p className="preview" aria-live="polite">Hello, <strong>{name.trim() || "there"}</strong>!</p>
              </div>;
            case 3:
              return <div className="demo-panel">
                <div className="panel-top"><h3>My practice list</h3><span className="live-pill">{items.length} {items.length === 1 ? "item" : "items"}</span></div>
                <form className="list-form" onSubmit={addItem}>
                  <input className="text-input" value={itemText} onChange={event => setItemText(event.target.value)} placeholder="Add a practice task" aria-label="New list item" />
                  <button className="button" type="submit">Add item</button>
                </form>
                {items.length ? <ul className="item-list">{items.map(item => <li className="list-row" key={item.id}><span>{item.label}</span><button className="icon-button" type="button" onClick={() => setItems(current => current.filter(entry => entry.id !== item.id))} aria-label={`Remove ${item.label}`}>Remove</button></li>)}</ul> : <p className="empty-state">Your list is empty. Add your first practice task above.</p>}
              </div>;
            case 4:
              return <div className="demo-panel">
                <div className="panel-top"><h3>Extra information</h3><span className="live-pill">Accessible toggle</span></div>
                <button className="button reveal-button" aria-expanded={detailsOpen} aria-controls="extra-details" onClick={() => setDetailsOpen(open => !open)}>{detailsOpen ? "Hide details" : "Show details"}</button>
                <div id="extra-details" hidden={!detailsOpen} className="reveal-content"><h3>Why this matters</h3><p>This section is rendered from a boolean state value. The button exposes its current state with <code>aria-expanded</code>, so assistive technology can announce whether the details are open.</p></div>
              </div>;
            case 5:
              return <div className="demo-panel">
                <div className="panel-top"><h3>Today’s tasks</h3><span className="live-pill">{completedCount} of {tasks.length} done</span></div>
                <div className="filter-tabs" aria-label="Filter tasks">{["All", "Active", "Done"].map(filter => <button key={filter} className="filter-button" aria-pressed={taskFilter === filter} onClick={() => setTaskFilter(filter)}>{filter}</button>)}</div>
                {filteredTasks.length ? <ul className="todo-list">{filteredTasks.map(task => <li className={`todo-row${task.done ? " done" : ""}`} key={task.id}><label><input type="checkbox" checked={task.done} onChange={() => setTasks(current => current.map(item => item.id === task.id ? { ...item, done: !item.done } : item))} /><span className="todo-text">{task.text}</span></label></li>)}</ul> : <p className="empty-state">No tasks in this view. Try another filter or add a task by switching to the list exercise.</p>}
                <div className="button-row" style={{ marginTop: 16 }}><button className="button secondary" onClick={() => setTasks(current => current.filter(task => !task.done))} disabled={!completedCount}>Clear completed</button></div>
              </div>;
            case 6:
              return <div className="demo-panel">
                <div className="panel-top"><h3>Contact details</h3><span className="live-pill">One form state object</span></div>
                <form className="form-grid" onSubmit={submitForm} noValidate>
                  <div><label className="field-label" htmlFor="contact-name">Name</label><input className="text-input" id="contact-name" name="name" value={form.name} onChange={updateForm} placeholder="Your name" autoComplete="name" /></div>
                  <div><label className="field-label" htmlFor="contact-email">Email</label><input className="text-input" id="contact-email" name="email" type="email" value={form.email} onChange={updateForm} placeholder="you@example.com" autoComplete="email" /></div>
                  <div className="button-row"><button className="button" type="submit">Check and submit</button></div>
                </form>
                {formMessage && <p className="form-message" role="status">{formMessage}</p>}
              </div>;
            case 7:
              return <div className="demo-panel">
                <div className="panel-top"><h3>Quick note</h3><span className="live-pill">Saved in this browser</span></div>
                <label className="field-label" htmlFor="saved-note">Your note</label>
                <textarea className="text-area" id="saved-note" value={note} onChange={event => setNote(event.target.value)} placeholder="Write a thought to keep for later…" />
                <div className="note-footer"><span className="save-status" role="status"><span className="save-dot" />{noteStatus}</span><button className="button secondary" onClick={() => setNote("")} disabled={!note}>Clear note</button></div>
              </div>;
            default:
              return null;
          }
        }

        return <main className="app-shell">
          <div className="topbar"><a className="brand" href="../index.html"><span className="brand-mark" aria-hidden="true">↗</span><span>Ruziboy · Coursework</span></a><a className="home-link" href="../index.html">Coursework home ↑</a></div>
          <header className="hero">
            <div><p className="eyebrow">Week 11_2 · React State &amp; Events</p><h1>Make the interface respond.</h1><p className="hero-copy">Practice updating the screen from user input with React state and event handlers. Pick an exercise, try it out, and open the code example when you’re ready.</p></div>
            <div className="hero-count" aria-label="Seven interactive exercises"><strong>07</strong><span>hands-on labs</span></div>
          </header>

          <div className="workspace">
            <aside className="sidebar" aria-label="Exercise navigation">
              <div className="sidebar-heading"><h2>Choose an exercise</h2><span className="progress-pill">{visited.length} / 7 explored</span></div>
              <nav className="exercise-nav">
                {exercises.map(exercise => <button key={exercise.id} className={`nav-item${activeId === exercise.id ? " active" : ""}`} aria-current={activeId === exercise.id ? "step" : undefined} onClick={() => selectExercise(exercise.id)}>
                  <span className="nav-number">E{exercise.id}</span><span className="nav-copy"><span className="nav-title">{exercise.short}</span><span className="nav-goal">{exercise.goal}</span></span><span className="nav-check" aria-hidden="true">{visited.includes(exercise.id) ? "✓" : "›"}</span>
                </button>)}
              </nav>
              <p className="sidebar-note">Your progress is kept in this tab while you explore the exercises.</p>
            </aside>

            <section className="work-card" aria-live="polite">
              <div className="exercise-head"><span className="exercise-mark">E{activeExercise.id}</span><div><p className="exercise-label">React state &amp; events · Exercise {activeExercise.id} of 7</p><h2>{activeExercise.title}</h2></div><span className="goal-pill">{activeExercise.goal}</span></div>
              <div className="exercise-body"><p className="hint">{activeExercise.description}</p>
                {renderExercise()}
                <details className="example-details"><summary>View React example</summary><div className="code-wrap"><pre><code>{examples[activeId]}</code></pre></div></details>
                <div className="bottom-nav"><button className="nav-step" disabled={activeId === 1} onClick={() => selectExercise(activeId - 1)}>← Previous</button><button className="nav-step" disabled={activeId === 7} onClick={() => selectExercise(activeId + 1)}>Next exercise →</button></div>
              </div>
            </section>
          </div>
        </main>;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
