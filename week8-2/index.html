<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register an account with validated username, email, and password fields.">
  <title>Week 8-2 | Register</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f7f6;
      --surface: #ffffff;
      --ink: #383838;
      --muted: #5d5d5d;
      --line: #c9c9c9;
      --success: #d3efda;
      --success-ink: #175a2a;
      --error: #a52e2e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 574px);
      padding: 32px 34px 34px;
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgb(0 0 0 / 9%);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      text-align: center;
    }

    form { display: grid; gap: 24px; }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      font: inherit;
    }

    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid #78a98e;
      outline-offset: 2px;
    }

    input[aria-invalid="true"] { border-color: var(--error); }

    button {
      min-height: 47px;
      margin-top: 1px;
      border: 0;
      border-radius: 5px;
      background: #347b4b;
      color: white;
      font: inherit;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover { background: #28643c; }

    .message {
      margin: -7px 0 0;
      padding: 11px 14px;
      border-radius: 5px;
      text-align: center;
      font-weight: 700;
    }

    .message[hidden] { display: none; }
    .message.success { background: var(--success); color: var(--success-ink); }
    .message.error { background: #f9e1df; color: var(--error); }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #286b54;
      font-size: .9rem;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      main { padding: 26px 20px; }
      form { gap: 19px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Register</h1>
    <form id="register-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" minlength="3" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit">Register</button>
      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
    </form>
    <a class="back-link" href="../index.html">← Home</a>
  </main>

  <script>
    const form = document.getElementById('register-form');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm-password');
    const message = document.getElementById('message');

    function validatePasswordMatch() {
      const matches = confirmPassword.value === password.value;
      confirmPassword.setCustomValidity(matches ? '' : 'Passwords do not match.');
      confirmPassword.setAttribute('aria-invalid', String(!matches && confirmPassword.value.length > 0));
      return matches;
    }

    password.addEventListener('input', validatePasswordMatch);
    confirmPassword.addEventListener('input', validatePasswordMatch);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      message.hidden = true;
      message.className = 'message';

      if (!validatePasswordMatch()) {
        confirmPassword.reportValidity();
        return;
      }

      message.textContent = 'Registration successful!';
      message.classList.add('success');
      message.hidden = false;
      form.reset();
      confirmPassword.removeAttribute('aria-invalid');
    });
  </script>
</body>
</html>
