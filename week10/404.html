<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Custom 404 page for the Book Search app." />
    <title>404 | Page Not Found</title>
    <style>
      :root {
        --bg: #0a1d2d;
        --bg-2: #102b3d;
        --panel: rgba(17, 37, 54, 0.96);
        --line: rgba(137, 167, 205, 0.34);
        --text: #edf8ff;
        --muted: #bdd3ea;
        --accent: #a8d8ff;
        --accent-strong: #9ea9ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #0a1d2d 0%, #040d16 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .card {
        width: min(700px, 100%);
        padding: clamp(28px, 5vw, 52px);
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(17, 37, 54, 0.95);
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.26);
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(168, 216, 255, 0.1);
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.08;
      }

      p {
        margin: 0 auto;
        max-width: 540px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 26px;
        padding: 0.9rem 1.4rem;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #0d1e2d;
        font-weight: 800;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        filter: brightness(1.04);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">404</div>
      <h1>Page not found</h1>
      <p>
        The page you are looking for does not exist or may have moved. Head back to the
        Book Search app and keep exploring.
      </p>
      <a href="./index.html">Back to Book Search</a>
    </main>
  </body>
</html>
