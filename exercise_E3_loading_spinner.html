<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Exercise E3
  </title>
  <style>@keyframes spin {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
}
.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ccfbf1;
    border-top: 4px solid #0f766e;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}</style>
 </head>
 <body>
  <div class="spinner">
  </div>
 </body>
