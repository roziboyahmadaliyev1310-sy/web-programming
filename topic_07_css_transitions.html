<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Topic 07: CSS Transitions
  </title>
  <style>.card {
    width: 240px;
    padding: 24px;
    background: #f0fdfa;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    transition: background 0.3s ease, transform 0.2s ease;
}
.card:hover {
    background: #0f766e;
    color: white;
    transform: translateY(-6px);
}</style>
 </head>
 <body>
  <div class="card">
   Hover over this card
  </div>
 </body>
</html>
