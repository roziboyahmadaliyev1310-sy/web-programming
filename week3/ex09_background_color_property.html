<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>background-color Property</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; padding: 32px; } .banner { padding: 18px 20px; border-radius: 12px; margin-bottom: 16px; font-weight: 700; } .green { background-color: #dcfce7; color: #166534; } .amber { background-color: #fef3c7; color: #92400e; } .dark { background-color: #1f2937; color: white; }
  </style>
</head>
<body>
  <div class="banner green">Green banner</div>
  <div class="banner amber">Amber warning</div>
  <div class="banner dark">Dark card</div>
</body>
</html>
