<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Selector (*)</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; } .demo { background: #ecfdf5; padding: 18px; border: 2px solid #10b981; border-radius: 12px; } h2 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Universal Selector Reset</h2>
    <p>This demo uses <code>* { box-sizing: border-box; }</code> so widths and padding stay predictable.</p>
    <p>It is a common reset pattern to make layout calculations easier.</p>
  </div>
</body>
</html>
