<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Selector (#id)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f3ff; color: #1f2937; padding: 32px; } #main-title { color: #6d28d9; font-size: 2.4rem; border-left: 6px solid #8b5cf6; padding-left: 12px; } #hero-banner { background: #ede9fe; padding: 24px; border-radius: 14px; max-width: 600px; }
  </style>
</head>
<body>
  <div id="hero-banner">
    <h1 id="main-title">CSS Introduction</h1>
    <p>This heading is styled using its unique <code>id</code>.</p>
  </div>
</body>
</html>
