<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which Selector Wins?</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } h2 { color: green; } .highlight { color: orange; } #title { color: purple; }
  </style>
</head>
<body>
  <h2 id="title" class="highlight">This heading is purple because the ID selector wins.</h2>
</body>
</html>
