<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E2 — Three Ways — Spot the Difference</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; padding: 36px; } .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; } .panel { background: white; border: 1px solid #dbe3ee; border-radius: 12px; padding: 18px; } .inline { color: #dc2626; font-weight: 700; } .internal { color: #15803d; font-weight: 700; } .external { color: #7c3aed; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <p class="inline" style="color:#dc2626; font-weight:700;">Inline styling</p>
    </div>
    <div class="panel">
      <p class="internal">Internal styling</p>
    </div>
    <div class="panel">
      <p class="external">External styling</p>
    </div>
  </div>
</body>
</html>
