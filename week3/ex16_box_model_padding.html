<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Model: Padding</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .box { background: #ecfdf5; border: 2px solid #10b981; width: 260px; margin-bottom: 16px; } .p1 { padding: 0; } .p2 { padding: 20px; } .p3 { padding: 10px 40px; }
  </style>
</head>
<body>
  <div class="box p1">padding: 0</div>
  <div class="box p2">padding: 20px</div>
  <div class="box p3">padding: 10px 40px</div>
</body>
</html>
