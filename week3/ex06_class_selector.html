<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Selector (.class)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ecfeff; color: #0f172a; padding: 32px; } .badge { display: inline-block; background: #0ea5e9; color: white; padding: 10px 16px; border-radius: 999px; margin-right: 12px; margin-bottom: 12px; } .warning { background: #fef3c7; color: #92400e; padding: 14px 18px; border-left: 6px solid #f59e0b; border-radius: 10px; }
  </style>
</head>
<body>
  <div>
    <span class="badge">HTML</span>
    <span class="badge">CSS</span>
    <span class="badge">JavaScript</span>
  </div>

  <div class="warning">This warning box uses a shared class selector so the same style can be reused.</div>
</body>
</html>
