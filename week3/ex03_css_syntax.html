<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Syntax</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #1e293b; padding: 32px; } .demo { max-width: 650px; margin: 0 auto; background: #fff; border-radius: 14px; border: 1px solid #dfe7ef; padding: 24px; } h1 { color: #166534; font-size: 2rem; text-align: center; } p { line-height: 1.7; }
  </style>
</head>
<body>
  <div class="demo">
    <h1>CSS Syntax Example</h1>
    <p>Every CSS rule uses the pattern: <strong>selector { property: value; }</strong>.</p>
    <p>For example, <code>h1 { color: green; font-size: 2rem; }</code> changes the color and size of the heading.</p>
  </div>
</body>
</html>
