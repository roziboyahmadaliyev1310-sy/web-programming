<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>font-weight Property</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .w300 { font-weight: 300; } .w400 { font-weight: 400; } .w500 { font-weight: 500; } .w700 { font-weight: 700; } .w900 { font-weight: 900; }
  </style>
</head>
<body>
  <p class="w300">300 — Light</p>
  <p class="w400">400 — Regular</p>
  <p class="w500">500 — Medium</p>
  <p class="w700">700 — Bold</p>
  <p class="w900">900 — Black</p>
</body>
</html>
