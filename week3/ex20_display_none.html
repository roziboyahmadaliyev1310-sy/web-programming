<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>display: none</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .box { padding: 12px 16px; margin: 8px 0; border: 2px solid #10b981; } .hidden { display: none; } .keep-space { visibility: hidden; }
  </style>
</head>
<body>
  <div class="box">Box 1 is visible.</div>
  <div class="box hidden">Box 2 is hidden with display: none.</div>
  <div class="box">Box 3 appears right after Box 1.</div>
  <div class="box keep-space">Box 4 is hidden but keeps its space.</div>
</body>
</html>
