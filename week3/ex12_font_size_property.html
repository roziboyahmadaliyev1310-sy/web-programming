<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>font-size Property</title>
  <style>
    html { font-size: 100%; } body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .small { font-size: 0.875rem; } .base { font-size: 1rem; } .large { font-size: 1.25rem; } .xl { font-size: 1.5rem; } .xxl { font-size: 2rem; }
  </style>
</head>
<body>
  <p class="small">0.875rem — small text</p>
  <p class="base">1rem — base text</p>
  <p class="large">1.25rem — large text</p>
  <p class="xl">1.5rem — extra large</p>
  <p class="xxl">2rem — heading size</p>
</body>
</html>
