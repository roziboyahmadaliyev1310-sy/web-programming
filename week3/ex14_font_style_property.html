<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>font-style Property</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .normal { font-style: normal; } .italic { font-style: italic; } .oblique { font-style: oblique; } blockquote { border-left: 4px solid #10b981; padding-left: 16px; color: #475569; font-style: italic; }
  </style>
</head>
<body>
  <p class="normal">Normal — upright text</p>
  <p class="italic">Italic — true italic</p>
  <p class="oblique">Oblique — slanted text</p>
  <blockquote>"CSS gives web pages their visual personality."</blockquote>
</body>
</html>
