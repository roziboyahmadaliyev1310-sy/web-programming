<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Model: Margin</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .box { background: #ecfdf5; border: 2px solid #10b981; padding: 12px; width: 220px; } .m0 { margin: 0; } .m20 { margin: 20px; } .center { margin: 0 auto; }
  </style>
</head>
<body>
  <div class="box m0">margin: 0</div>
  <div class="box m20">margin: 20px</div>
  <div class="box center">margin: 0 auto</div>
</body>
</html>
