<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RGB Color Values</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .box { padding: 14px 18px; margin: 8px 0; color: white; border-radius: 10px; } .a { background-color: rgb(255, 0, 0); } .b { background-color: rgb(21, 128, 61); } .c { background-color: rgb(29, 78, 216); } .d { background-color: rgba(0, 0, 0, 0.45); }
  </style>
</head>
<body>
  <div class="box a">rgb(255, 0, 0)</div>
  <div class="box b">rgb(21, 128, 61)</div>
  <div class="box c">rgb(29, 78, 216)</div>
  <div class="box d">rgba(0, 0, 0, 0.45)</div>
</body>
</html>
