<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type / Element Selector</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; color: #111827; padding: 32px; } h2 { color: #0f766e; } p { color: #374151; line-height: 1.7; } strong { color: #b45309; }
  </style>
</head>
<body>
  <h2>Type Selector Example</h2>
  <p>All paragraph elements use the same style, and all <strong>strong</strong> text can be targeted separately.</p>
  <p>This is a good example of a simple element selector.</p>
</body>
</html>
