<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>display: block</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .block { display: block; width: 260px; background: #ecfdf5; border: 2px solid #10b981; padding: 12px; margin: 6px 0; } nav a { display: block; background: #1e293b; color: white; text-decoration: none; padding: 10px 16px; margin-bottom: 4px; border-radius: 6px; }
  </style>
</head>
<body>
  <span class="block">This span is forced to block.</span>
  <span class="block">It starts on a new line.</span>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</body>
</html>
