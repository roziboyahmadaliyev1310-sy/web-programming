<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E3 — Color Palette Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 40px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(15,23,42,0.06);
    }
    .swatches {
      display: flex;
    }
    .swatch {
      flex: 1;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }
    .c1 { background: #ffffff; color: #111827; }
    .c2 { background: #e2e8f0; color: #111827; }
    .c3 { background: #0f172a; }
    .c4 { background: #16a34a; }
    .c5 { background: #2563eb; }
    .content { padding: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="swatches">
      <div class="swatch c1">White</div>
      <div class="swatch c2">Gray</div>
      <div class="swatch c3">Black</div>
      <div class="swatch c4">Green</div>
      <div class="swatch c5">Blue</div>
    </div>
    <div class="content">
      <h2>AKHMADALIEV RUZIBOY</h2>
      <p>Favorite color: white. Hobby: playing football. Student at Gachon University, 2nd year.</p>
    </div>
  </div>
</body>
</html>
