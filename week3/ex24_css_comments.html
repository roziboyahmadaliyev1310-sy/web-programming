<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Comments</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 32px; background: #f8fafc; color: #111827; } /* This is a CSS comment */ .note { background: #ecfeff; color: #0f172a; border-left: 4px solid #06b6d4; padding: 14px 18px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="note">Comments help explain the code without affecting the page.</div>
</body>
</html>
