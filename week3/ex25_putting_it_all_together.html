<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Putting It All Together</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 40px;
      color: #0f172a;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 26px;
    }
    .body {
      padding: 24px;
    }
    .tag {
      display: inline-block;
      background: #f8fafc;
      color: #0f172a;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 12px;
    }
    p {
      margin: 0;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="tag">Student</span>
      <h2>AKHMADALIEV RUZIBOY</h2>
    </div>
    <div class="body">
      <p>I am a student at Gachon University. This is my second year here, my favorite color is white, and my hobby is playing football.</p>
    </div>
  </div>
</body>
</html>
