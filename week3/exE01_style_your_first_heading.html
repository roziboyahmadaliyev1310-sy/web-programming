<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E1 — Style Your First Heading</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px;
    }
    .box {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border: 1px solid #dbe3ee;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(15,23,42,0.06);
    }
    h1 {
      color: #0f172a;
      text-align: center;
      font-size: 2.5rem;
    }
    p {
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>AKHMADALIEV RUZIBOY</h1>
    <p>I am a student at Gachon University, in my second year. My favorite color is white, and my hobby is playing football.</p>
  </div>
</body>
</html>
