<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Model Width Calculation</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .content-box { box-sizing: content-box; width: 200px; padding: 10px; border: 5px solid #10b981; background: #ecfdf5; margin-bottom: 20px; } .border-box { box-sizing: border-box; width: 200px; padding: 10px; border: 5px solid #7c3aed; background: #f5f3ff; }
  </style>
</head>
<body>
  <div class="content-box">content-box</div>
  <p>Actual width = 200 + 20 + 10 = 230px.</p>
  <div class="border-box">border-box</div>
  <p>Actual width = exactly 200px.</p>
</body>
</html>
