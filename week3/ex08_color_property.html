<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>color Property</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9fafb; color: #111827; padding: 32px; } .red { color: red; } .green { color: green; } .blue { color: blue; } .purple { color: #7c3aed; }
  </style>
</head>
<body>
  <p class="red">This text is red.</p>
  <p class="green">This text is green.</p>
  <p class="blue">This text is blue.</p>
  <p class="purple">This text uses a purple hex value.</p>
</body>
</html>
