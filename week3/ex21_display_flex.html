<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>display: flex</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .nav { display: flex; gap: 16px; padding: 16px; background: #0f172a; border-radius: 12px; } .nav a { color: white; text-decoration: none; } .cards { display: flex; gap: 20px; margin-top: 24px; } .card { flex: 1; background: white; border: 1px solid #dbe3ee; border-radius: 12px; padding: 18px; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="#">Home</a>
    <a href="#">Topics</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </nav>

  <div class="cards">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>
</body>
</html>
