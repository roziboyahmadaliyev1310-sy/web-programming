<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex Color Codes</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; padding: 32px; } .swatch { display: inline-block; padding: 16px 18px; color: white; margin: 6px; border-radius: 10px; font-weight: 700; } .red { background-color: #ff0000; } .green { background-color: #00ff00; color: #111827; } .blue { background-color: #0000ff; } .emerald { background-color: #10b981; } .black { background-color: #000000; }
  </style>
</head>
<body>
  <div class="swatch red">#FF0000</div>
  <div class="swatch green">#00FF00</div>
  <div class="swatch blue">#0000FF</div>
  <div class="swatch emerald">#10B981</div>
  <div class="swatch black">#000000</div>
</body>
</html>
